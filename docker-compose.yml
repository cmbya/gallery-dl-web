# 从当前检出的源码构建；默认 bridge 通过 links 连接后端。
# 必须使用 docker compose up -d --build，不要拉取上游英文镜像。
name: ins-net

services:
  backend:
    build: ./backend
    image: gallery-dl-web-backend-cmbya:automation
    restart: unless-stopped
    network_mode: bridge
    environment:
      DATA_DIR: /data
      DOWNLOADS_DIR: ${DOWNLOADS_DIR:-/downloads}
      COOKIES_PATH: /data/cookies.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://192.168.100.125:3089}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ZIP_TTL_SECONDS: ${ZIP_TTL_SECONDS:-300}
      THUMBNAIL_SIZE: ${THUMBNAIL_SIZE:-300}
      PAUSE_MAX_SECONDS: ${PAUSE_MAX_SECONDS:-7200}
      INSTAGRAM_PACING_MODE: ${INSTAGRAM_PACING_MODE:-adaptive}
      FACEBOOK_PACING_MODE: ${FACEBOOK_PACING_MODE:-adaptive}
      INSTAGRAM_SLEEP_REQUEST_MIN: ${INSTAGRAM_SLEEP_REQUEST_MIN:-4}
      INSTAGRAM_SLEEP_REQUEST_MAX: ${INSTAGRAM_SLEEP_REQUEST_MAX:-30}
      FACEBOOK_SLEEP_REQUEST_MIN: ${FACEBOOK_SLEEP_REQUEST_MIN:-1}
      FACEBOOK_SLEEP_REQUEST_MAX: ${FACEBOOK_SLEEP_REQUEST_MAX:-30}
      # Per-IMAGE pacing (both modes); 0 disables. FB is 0 because it already pays the request
      # delay once per photo.
      INSTAGRAM_SLEEP_FILE: ${INSTAGRAM_SLEEP_FILE:-2}
      FACEBOOK_SLEEP_FILE: ${FACEBOOK_SLEEP_FILE:-0}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-15}
      STALL_LIVENESS_SECONDS: ${STALL_LIVENESS_SECONDS:-60}
      STALL_WARMUP_SECONDS: ${STALL_WARMUP_SECONDS:-600}
      STALL_WARMUP_MAX_RETRIES: ${STALL_WARMUP_MAX_RETRIES:-1}
      STALL_FLOOR_SECONDS: ${STALL_FLOOR_SECONDS:-300}
      STALL_MULTIPLIER: ${STALL_MULTIPLIER:-4}
      STALL_CAP_SECONDS: ${STALL_CAP_SECONDS:-600}
      STALL_MAX_RETRIES: ${STALL_MAX_RETRIES:-2}
      STALL_BACKOFF: ${STALL_BACKOFF:-1.5}
      STALL_KILL_GRACE_SECONDS: ${STALL_KILL_GRACE_SECONDS:-10}
    volumes:
      - /vol2/1000/docker/INS-NET/data:/data
      - /vol2/1000/图库/download:/downloads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build: ./frontend
    image: gallery-dl-web-frontend-cmbya:automation
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3089:3000"
    network_mode: bridge
    links:
      - "backend:backend"
    depends_on:
      backend:
        condition: service_healthy
